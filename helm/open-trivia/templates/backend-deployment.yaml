apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "open-trivia.fullname" . }}-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "open-trivia.fullname" . }}-backend
  template:
    metadata:
      labels:
        app: {{ include "open-trivia.fullname" . }}-backend
    spec:
      containers:
        - name: backend
          image: {{ .Values.image.backend.repository }}:{{ .Values.image.backend.tag }}
          ports:
            - containerPort: {{ .Values.backend.service.port }}
          env:
            - name: PG_HOST
              valueFrom: { configMapKeyRef: { name: {{ include "open-trivia.fullname" . }}-config, key: PG_HOST } }
            - name: PG_PORT
              valueFrom: { configMapKeyRef: { name: {{ include "open-trivia.fullname" . }}-config, key: PG_PORT } }
            - name: PG_USER
              valueFrom: { configMapKeyRef: { name: {{ include "open-trivia.fullname" . }}-config, key: PG_USER } }
            - name: PG_PASSWORD
              valueFrom: { configMapKeyRef: { name: {{ include "open-trivia.fullname" . }}-config, key: PG_PASSWORD } }
            - name: PG_DB
              valueFrom: { configMapKeyRef: { name: {{ include "open-trivia.fullname" . }}-config, key: PG_DB } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: {{ include "open-trivia.fullname" . }}-secret, key: JWT_SECRET } }
            - name: APP_URL
              valueFrom: { configMapKeyRef: { name: {{ include "open-trivia.fullname" . }}-config, key: APP_URL } }
            - name: SMTP_HOST
              valueFrom: { configMapKeyRef: { name: {{ include "open-trivia.fullname" . }}-config, key: SMTP_HOST } }
            - name: SMTP_PORT
              valueFrom: { configMapKeyRef: { name: {{ include "open-trivia.fullname" . }}-config, key: SMTP_PORT } }
            - name: SMTP_SECURE
              valueFrom: { configMapKeyRef: { name: {{ include "open-trivia.fullname" . }}-config, key: SMTP_SECURE } }
            - name: SMTP_USER
              valueFrom: { configMapKeyRef: { name: {{ include "open-trivia.fullname" . }}-config, key: SMTP_USER } }
            - name: SMTP_PASS
              valueFrom: { configMapKeyRef: { name: {{ include "open-trivia.fullname" . }}-config, key: SMTP_PASS } }
            - name: SMTP_FROM
              valueFrom: { configMapKeyRef: { name: {{ include "open-trivia.fullname" . }}-config, key: SMTP_FROM } }
